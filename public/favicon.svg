<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <!-- Favicon Card Background -->
  <rect width="160" height="160" fill="#fcfbf7" rx="24"/>

  <!-- Ruler Scale Top Section -->
  <path d="M 25 32 L 135 32 L 135 70" stroke="#16181d" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter" />

  <!-- Left Ruler Stop Line -->
  <line x1="26" y1="32" x2="26" y2="54" stroke="#16181d" stroke-width="7" stroke-linecap="square" />

  <!-- Ruler Tick Marks -->
  <line x1="40" y1="32" x2="40" y2="44" stroke="#16181d" stroke-width="3" stroke-linecap="square" />
  <line x1="55" y1="32" x2="55" y2="50" stroke="#16181d" stroke-width="3" stroke-linecap="square" />
  <line x1="70" y1="32" x2="70" y2="44" stroke="#16181d" stroke-width="3" stroke-linecap="square" />
  <line x1="85" y1="32" x2="85" y2="54" stroke="#16181d" stroke-width="4" stroke-linecap="square" />
  <line x1="100" y1="32" x2="100" y2="44" stroke="#16181d" stroke-width="3" stroke-linecap="square" />
  <line x1="115" y1="32" x2="115" y2="50" stroke="#16181d" stroke-width="3" stroke-linecap="square" />

  <!-- Checkmark Body -->
  <path d="M 60 100 L 82 124 L 135 60" stroke="#16181d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
</svg>
