<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <!-- Off-White / Monochrome Background Card -->
  <rect width="200" height="200" fill="#fcfbf7" rx="16"/>

  <!-- Ruler Scale Top Section + Corner Curve -->
  <path d="M 40 45 L 160 45 L 160 85" stroke="#16181d" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter" />

  <!-- Left Ruler Stop Line -->
  <line x1="42" y1="45" x2="42" y2="70" stroke="#16181d" stroke-width="7" stroke-linecap="square" />

  <!-- Ruler Tick Marks -->
  <line x1="56" y1="45" x2="56" y2="58" stroke="#16181d" stroke-width="3" stroke-linecap="square" />
  <line x1="70" y1="45" x2="70" y2="65" stroke="#16181d" stroke-width="3" stroke-linecap="square" />
  <line x1="84" y1="45" x2="84" y2="58" stroke="#16181d" stroke-width="3" stroke-linecap="square" />
  <line x1="98" y1="45" x2="98" y2="70" stroke="#16181d" stroke-width="4" stroke-linecap="square" />
  <line x1="112" y1="45" x2="112" y2="58" stroke="#16181d" stroke-width="3" stroke-linecap="square" />
  <line x1="126" y1="45" x2="126" y2="65" stroke="#16181d" stroke-width="3" stroke-linecap="square" />
  <line x1="140" y1="45" x2="140" y2="58" stroke="#16181d" stroke-width="3" stroke-linecap="square" />
  <line x1="154" y1="45" x2="154" y2="65" stroke="#16181d" stroke-width="3" stroke-linecap="square" />

  <!-- Checkmark Body extending from bottom-left to top-right -->
  <path d="M 80 114 L 102 136 L 160 76" stroke="#16181d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Thin Divider Rule -->
  <line x1="40" y1="152" x2="160" y2="152" stroke="#16181d" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Brand Typography -->
  <text x="100" y="170" text-anchor="middle" fill="#16181d" font-size="14" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, sans-serif" letter-spacing="2.5">SLABCHECK</text>
  <text x="100" y="184" text-anchor="middle" fill="#16181d" font-size="7.5" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, sans-serif" letter-spacing="1.8" opacity="0.65">HAND-CALC VERIFIED</text>
</svg>
